version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: campus-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - campus-network

  redis:
    image: redis:7.0-alpine
    container_name: campus-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - campus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/campus-dating?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - campus-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: campus-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - campus-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  campus-network:
    driver: bridge
